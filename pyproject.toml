[project]
name = "pyrapidwright"
version = "0.1.0"
requires-python = ">=3.8"
description = "Python library and CLI for scripting RapidWright: DCP reports, net search, ILA insertion."
dependencies = [
    "jpype1>=1.4.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
pyrapidwright = "pyrapidwright.cli:main"

[tool.setuptools.packages.find]
include = ["pyrapidwright*"]
exclude = ["rapidwright*", "examples*"]
