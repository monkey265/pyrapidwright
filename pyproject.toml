[project]
name = "pyrapidwright"
version = "0.1.0"
description = "A boilerplate for RapidWright-based ILA insertion in DCPs."
dependencies = [
    "jpype1>=1.4.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
pyrapidwright = "pyrapidwright.cli:main"

[tool.setuptools.packages.find]
include = ["pyrapidwright*"]
exclude = ["rapidwright*", "examples*"]
